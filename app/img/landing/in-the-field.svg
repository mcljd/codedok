<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coded RIB at speed offshore">
  <defs>
    <linearGradient id="sky-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#243036"/>
      <stop offset="100%" stop-color="#0F4C5C"/>
    </linearGradient>
    <linearGradient id="water-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#0A2630"/>
    </linearGradient>
    <linearGradient id="rib-tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1C252B"/>
      <stop offset="100%" stop-color="#0A1418"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="2000" height="620" fill="url(#sky-f)"/>
  <!-- Soft cloud bands -->
  <g fill="#F3F5F4" opacity=".08">
    <ellipse cx="320"  cy="220" rx="380" ry="38"/>
    <ellipse cx="1100" cy="180" rx="520" ry="42"/>
    <ellipse cx="1700" cy="260" rx="280" ry="30"/>
    <ellipse cx="600"  cy="350" rx="420" ry="28"/>
  </g>
  <!-- Distant headland -->
  <path d="M 0 560 L 220 540 L 480 555 L 760 525 L 1080 555 L 1380 540 L 1720 565 L 2000 548 L 2000 620 L 0 620 Z" fill="#0A2F3A"/>

  <!-- Water -->
  <rect y="620" width="2000" height="480" fill="url(#water-f)"/>

  <!-- Ambient water highlights -->
  <g fill="#F3F5F4" opacity=".06">
    <rect x="0"    y="720" width="900" height="2"/>
    <rect x="200"  y="780" width="600" height="2"/>
    <rect x="900"  y="820" width="800" height="2"/>
    <rect x="1300" y="900" width="500" height="2"/>
    <rect x="60"   y="980" width="800" height="2"/>
    <rect x="1200" y="1020" width="700" height="2"/>
  </g>

  <!-- Wake — long spray trail from right-foreground RIB -->
  <g opacity=".75">
    <path d="M 1500 760 Q 1100 770, 700 820 Q 360 880, 60 1000"
          stroke="#F3F5F4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 1500 780 Q 1080 800, 660 870 Q 340 940, 40 1060"
          stroke="#F3F5F4" stroke-width="4" fill="none" stroke-linecap="round" opacity=".65"/>
    <path d="M 1500 790 Q 1100 820, 720 900 Q 420 980, 100 1080"
          stroke="#F3F5F4" stroke-width="3" fill="none" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- Spray clouds in the wake -->
  <g fill="#F3F5F4" opacity=".5">
    <circle cx="1380" cy="760" r="18"/>
    <circle cx="1410" cy="745" r="14"/>
    <circle cx="1340" cy="775" r="22"/>
    <circle cx="1300" cy="760" r="16"/>
    <circle cx="1260" cy="780" r="12"/>
    <circle cx="1220" cy="770" r="10"/>
    <circle cx="1170" cy="790" r="14"/>
    <circle cx="1100" cy="800" r="10"/>
  </g>

  <!-- Distant RIB silhouette far left (gives scale + depth) -->
  <g transform="translate(280 660)" opacity=".6">
    <ellipse cx="60" cy="0" rx="60" ry="6" fill="#0A1418"/>
    <path d="M 0 0 L 120 0 L 110 -16 L 10 -16 Z" fill="#0A1418"/>
    <rect x="40" y="-36" width="40" height="20" fill="#0A1418"/>
    <rect x="56" y="-58" width="6"  height="24" fill="#0A1418"/>
  </g>

  <!-- Foreground RIB at speed, three-quarter view -->
  <g transform="translate(1100 660)">
    <!-- Hull underside (bouncing on plane — slight rise) -->
    <path d="M 0 0 L 540 0 L 510 -60 L 30 -60 Z" fill="#1C252B"/>
    <!-- Inflatable tube — red accent for that "coastguard / pilot" feel -->
    <path d="M 30 -60 L 510 -60 L 480 -88 L 60 -88 Z" fill="url(#rib-tube)"/>
    <path d="M 60 -88 Q 280 -100, 480 -88" stroke="#A14A3B" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Hull stripe -->
    <rect x="40" y="-40" width="460" height="6" fill="#F3F5F4" opacity=".7"/>
    <!-- Console / cabin -->
    <path d="M 200 -88 L 360 -88 L 350 -158 L 220 -158 Z" fill="#F3F5F4"/>
    <rect x="218" y="-150" width="120" height="40" fill="#0F4C5C"/>
    <!-- T-top frame -->
    <rect x="212" y="-200" width="140" height="6"  fill="#1C252B"/>
    <rect x="216" y="-200" width="6"  height="60" fill="#1C252B"/>
    <rect x="342" y="-200" width="6"  height="60" fill="#1C252B"/>
    <!-- Antenna -->
    <rect x="279" y="-238" width="4" height="42" fill="#1C252B"/>
    <!-- Outboard motors -->
    <rect x="490" y="-50" width="14" height="42" fill="#1C252B"/>
    <rect x="486" y="-58" width="22" height="14" fill="#1C252B"/>
    <!-- Bow spray right at the front -->
    <g fill="#F3F5F4" opacity=".85">
      <circle cx="-10" cy="-20" r="18"/>
      <circle cx="20"  cy="-40" r="14"/>
      <circle cx="50"  cy="-12" r="10"/>
      <circle cx="-30" cy="-46" r="10"/>
    </g>
  </g>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig-f" cx="50%" cy="60%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="2000" height="1100" fill="url(#vig-f)" pointer-events="none"/>
</svg>
