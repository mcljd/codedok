# CodedOK — Supabase project config
#
# The GitHub integration reads this to know which project the
# supabase/functions/* directory should deploy to. Edge functions in
# supabase/functions/<name>/index.ts auto-deploy on push to main.

project_id = "zftoqqrqsxctehltebad"

[functions.generate-sms]
# Called by signed-in users after the £10 charge.
verify_jwt = true

[functions.extract-cert]
# Called by signed-in users (surveyor or operator) to extract structured
# fields from a single certificate photo / PDF via Claude vision.
verify_jwt = true

[functions.apple-link]
# Called by a signed-in user right after Sign in with Apple to store the
# refresh token (needed to revoke it on account deletion).
verify_jwt = true

[functions.delete-account]
# Called by a signed-in user to delete their own account + data.
verify_jwt = true

[functions.revenuecat-webhook]
# RevenueCat does not send a Supabase JWT; the function checks its own
# REVENUECAT_WEBHOOK_AUTH header instead (constant-time, fails closed).
verify_jwt = false

[functions.send-reminders]
# Called by pg_cron with the service-role key; the function also checks it.
verify_jwt = true

[functions.send-reminder-emails]
verify_jwt = true

[functions.admin-user-actions]
# Signed-in support/admin users only (checked inside the function).
verify_jwt = true
