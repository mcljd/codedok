<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#f8fafc"/>

  <!-- Title -->
  <text x="32" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0a1628">CodedOK — Brand Colours</text>

  <!-- PRIMARY -->
  <text x="32" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">PRIMARY</text>

  <!-- Navy Deep -->
  <rect x="32" y="82" width="100" height="100" rx="10" fill="#0a1628"/>
  <text x="82" y="220" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0a1628" text-anchor="middle">Navy Deep</text>
  <text x="82" y="234" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#0A1628</text>
  <text x="82" y="247" font-family="-apple-system,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">R10 G22 B40</text>

  <!-- Navy Mid -->
  <rect x="148" y="82" width="100" height="100" rx="10" fill="#1a3560"/>
  <text x="198" y="220" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0a1628" text-anchor="middle">Navy Mid</text>
  <text x="198" y="234" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#1A3560</text>
  <text x="198" y="247" font-family="-apple-system,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">R26 G53 B96</text>

  <!-- Cyan -->
  <rect x="264" y="82" width="100" height="100" rx="10" fill="#0891b2"/>
  <text x="314" y="220" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0a1628" text-anchor="middle">Ocean Cyan</text>
  <text x="314" y="234" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#0891B2</text>
  <text x="314" y="247" font-family="-apple-system,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">R8 G145 B178</text>

  <!-- Cyan Light -->
  <rect x="380" y="82" width="100" height="100" rx="10" fill="#06b6d4"/>
  <text x="430" y="220" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0a1628" text-anchor="middle">Cyan Light</text>
  <text x="430" y="234" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#06B6D4</text>
  <text x="430" y="247" font-family="-apple-system,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">R6 G182 B212</text>

  <!-- Green Tick -->
  <rect x="496" y="82" width="100" height="100" rx="10" fill="#16a34a"/>
  <text x="546" y="220" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0a1628" text-anchor="middle">Compliance Green</text>
  <text x="546" y="234" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#16A34A</text>
  <text x="546" y="247" font-family="-apple-system,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">R22 G163 B74</text>

  <!-- SECONDARY -->
  <text x="32" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">SECONDARY / STATUS</text>

  <!-- Amber -->
  <rect x="32" y="290" width="76" height="76" rx="8" fill="#d4a017"/>
  <text x="70" y="382" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#0a1628" text-anchor="middle">Amber</text>
  <text x="70" y="394" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">#D4A017</text>

  <!-- Red -->
  <rect x="120" y="290" width="76" height="76" rx="8" fill="#dc2626"/>
  <text x="158" y="382" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#0a1628" text-anchor="middle">Danger Red</text>
  <text x="158" y="394" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">#DC2626</text>

  <!-- Slate -->
  <rect x="208" y="290" width="76" height="76" rx="8" fill="#94a3b8"/>
  <text x="246" y="382" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#0a1628" text-anchor="middle">Slate</text>
  <text x="246" y="394" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">#94A3B8</text>

  <!-- Off white -->
  <rect x="296" y="290" width="76" height="76" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="334" y="382" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#0a1628" text-anchor="middle">Off White</text>
  <text x="334" y="394" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">#F1F5F9</text>

  <!-- White -->
  <rect x="384" y="290" width="76" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="422" y="382" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#0a1628" text-anchor="middle">White</text>
  <text x="422" y="394" font-family="-apple-system,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">#FFFFFF</text>
</svg>
