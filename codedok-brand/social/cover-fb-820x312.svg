<?xml version="1.0" encoding="UTF-8"?>
<!-- Facebook cover photo — 820×312 desktop / 640×360 mobile-safe area
     The "safe zone" for both is roughly the centre 640×312. Keep all
     critical content inside that. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1A3560"/>
    </linearGradient>
    <radialGradient id="blob" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="820" height="312" fill="url(#bg)"/>
  <rect width="820" height="312" fill="url(#blob)"/>
  <rect width="820" height="312" fill="url(#blob2)"/>

  <!-- Centre-safe content -->
  <g transform="translate(110 80)" font-family="Inter, system-ui, sans-serif">
    <text x="0" y="0" font-size="46" font-weight="700" fill="white" letter-spacing="-1.5">
      Compliance for coded skippers
    </text>
    <text x="0" y="56" font-size="46" font-weight="700" fill="white" letter-spacing="-1.5">
      finally <tspan fill="#06B6D4">built for the boat.</tspan>
    </text>
    <text x="0" y="108" font-size="16" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="0">
      codedok.com  ·  £19/month  ·  Free for your first vessel
    </text>
  </g>

  <!-- Mark on the right -->
  <g transform="translate(680 156)">
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -50 -32 Q -25 -54 0 -32 T 50 -32" stroke="#06B6D4" stroke-width="6"/>
      <path d="M -50 -12 Q -25 -34 0 -12 T 50 -12" stroke="#0891B2" stroke-width="5" opacity="0.7"/>
    </g>
    <circle cy="22" r="32" fill="#16A34A"/>
    <path d="M -14 22 L -4 33 L 16 11" transform="translate(0 0)"
          stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
